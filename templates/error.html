{% extends "base.html" %}
{% block title %}{{ code }} — TradeLink{% endblock %}
{% block content %}
<div class="page-band page-band--slim">
  <div class="container">
    <nav class="breadcrumb">
      <a href="{{ url_for('home') }}">Home</a><span class="sep">/</span><span>Error {{ code }}</span>
    </nav>
    <h1>Oops — {{ msg }}</h1>
    <p>The page you're looking for isn't available.</p>
  </div>
</div>
<div class="container" style="padding-top:48px">
  <div class="empty" style="padding:40px 24px">
    <div style="font-family:var(--font-display);font-size:72px;font-weight:800;color:var(--primary-200);margin-bottom:16px">{{ code }}</div>
    <a class="btn btn-primary" href="{{ url_for('home') }}" style="margin-top:20px">Back to Home</a>
  </div>
</div>
{% endblock %}
